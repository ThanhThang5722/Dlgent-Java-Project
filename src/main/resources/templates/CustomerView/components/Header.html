<!-- Header Component -->
<nav class="navbar navbar-expand-md sticky-top navbar-shrink py-3" id="mainNav" th:fragment="header">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/homepage">
            <span style="font-size: 24px; font-weight: 700; color:black">DLEGENT</span>
        </a>
        <button data-bs-toggle="collapse" class="navbar-toggler" data-bs-target="#navcol-1">
            <span class="visually-hidden">Toggle navigation</span>
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse d-xl-flex" id="navcol-1">
            <ul class="navbar-nav d-xl-flex mx-auto">
                <!-- Navigation items có thể thêm sau -->
            </ul>

            <!-- Right Menu - Conditional based on login status -->
            <div th:if="${isLoggedIn}" class="d-flex align-items-center gap-3">
                <!-- Giỏ hàng -->
                <a th:href="@{/gio-hang}" class="cart-button">
                    <i class="bi bi-cart3"></i>
                    <span class="cart-count" th:text="${cartCount != null ? cartCount : '0'}"
                        th:style="${cartCount == null || cartCount == 0} ? 'display: none;' : ''">0</span>
                </a>

                <!-- User Account -->
                <div class="user-account dropdown">
                    <button class="avatar-button" type="button" id="userDropdown" data-bs-toggle="dropdown"
                        aria-expanded="false">
                        <img src="https://ui-avatars.com/api/?name=User&background=198754&color=fff&rounded=true"
                            alt="User Avatar" class="avatar-img">
                        <i class="bi bi-chevron-down ms-2"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" th:href="@{/user/profile}"><i class="bi bi-person me-2"></i>Tài
                                khoản</a>
                        </li>
                        <li><a class="dropdown-item" th:href="@{/user/booking-history}"><i
                                    class="bi bi-clock-history me-2"></i>Lịch sử đặt
                                phòng</a></li>
                        <li><a class="dropdown-item" th:href="@{/user/point-redemption}"><i
                                    class="bi bi-coin me-2"></i>Quy đổi điểm</a></li>
                        <li><a class="dropdown-item" th:href="@{/user/discount-codes}"><i class="bi bi-tag me-2"></i>Mã
                                giảm giá của tôi</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item" th:href="@{/user/change-password}"><i
                                    class="bi bi-key me-2"></i>Đổi mật khẩu</a></li>
                        <li><a class="dropdown-item" href="#" onclick="logout()"><i
                                    class="bi bi-box-arrow-right me-2"></i>Đăng xuất</a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Login/Signup buttons for non-logged in users -->
            <div th:unless="${isLoggedIn}" class="d-flex align-items-center gap-2">
                <a class="btn btn-primary shadow" role="button" href="/getstarted"
                    style="background: var(--bs-success);border-color: var(--bs-success);margin: 5px;">Sign
                    up</a>
                <a class="btn btn-primary shadow" role="button" href="/getstarted"
                    style="background: rgb(255,255,255);color: rgb(0,0,0);border-color: rgb(195,195,195);">Login</a>
            </div>
        </div>
    </div>
</nav>

<!-- Header JavaScript Fragment -->
<div th:fragment="headerScript">
    <script th:src="@{/js/CustomerView/Header.js}"></script>
</div>
